[pytest]
addopts = -p pytest_homeassistant_custom_component
asyncio_mode = auto
pythonpath = /workspaces/ha_data/config
testpaths = tests
filterwarnings =
    # --- Paranoia Mode: promote all DeprecationWarnings to errors by default ---
    error::DeprecationWarning
    # --- Surgical exceptions: third-party libs we cannot control ---
    ignore::DeprecationWarning:litellm.*:
    ignore::DeprecationWarning:homeassistant.components.http.*:
    # --- Surgical exceptions: internal ssl.TLSVersion.TLSv1 (Samsung legacy protocol) ---
    # These are now wrapped in warnings.catch_warnings() in production code, but keep
    # the pytest-level filter as a belt-and-suspenders guard for import-time evaluation.
    ignore:ssl.TLSVersion.TLSv1 is deprecated:DeprecationWarning:ssl:
    # --- Surgical exceptions: our own intentional deprecation notices for legacy connection types ---
    # Tests that exercise ConnectionRequest / ConnectionRequestTlsAuto constructors must not
    # crash under Paranoia Mode. The warnings are intentional and tested explicitly.
    ignore:The 'request' connection method is deprecated:DeprecationWarning:
    ignore:The 'request_tls_auto' connection method is deprecated:DeprecationWarning:
    # --- RuntimeWarning: unawaited AsyncMock coroutines from test infrastructure ---
    ignore::RuntimeWarning
    ignore::pytest.PytestConfigWarning

markers =
    skip_legacy: marks tests as legacy for deprecated sync platforms
