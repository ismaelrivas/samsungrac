device:
  # Map to extract unique identifiers from the initial device state.
  identifiers:
    # Path in the status JSON to find the list of devices.
    path_to_devices: ["Devices"]
    # Key for the device ID (used in command URLs).
    id: ["id"]
    # Key for the UUID (used as unique_id in Home Assistant).
    uuid: ["uuid"]
  poll: True
  connection:
    type: request
    keep_alive: True
    params:
      verify: False
      headers: { "Authorization": "Bearer __CLIMATE_IP_TOKEN__", "Content-Type": "application/json" }
  status:
    type: 'json_status'
    connection:
      params: { method : 'GET', url: 'https://__CLIMATE_IP_HOST__:8888/devices' }
  operations:
    hvac: # hvac_mode
      type: modes
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/0/mode' }
      values:
        'cool':
          value : 'Cool'
          connection: # Main command (sets the mode)
            params: { json: { "modes": ["Cool"] } }
            connection: # Nested command (ensures it is on)
              params: { json: { "Operation": { "power" : "On" } }, url: 'https://__CLIMATE_IP_HOST__:8888/devices/0' }
              condition_template: "{% if device_state.Operation.power == 'Off' -%}1{%- else -%}0{%- endif %}"
        'heat':
          value : 'Heat'
          connection: # Main command (sets the mode)
            params: { json: { "modes": ["Heat"] } }
            connection: # Nested command (ensures it is on)
              params: { json: { "Operation": { "power" : "On" } }, url: 'https://__CLIMATE_IP_HOST__:8888/devices/0' }
              condition_template: "{% if device_state.Operation.power == 'Off' -%}1{%- else -%}0{%- endif %}"
        'dry':
          value : 'Dry'
          connection: # Main command (sets the mode)
            params: { json: { "modes": ["Dry"] } }
            connection: # Nested command (ensures it is on)
              params: { json: { "Operation": { "power" : "On" } }, url: 'https://__CLIMATE_IP_HOST__:8888/devices/0' }
              condition_template: "{% if device_state.Operation.power == 'Off' -%}1{%- else -%}0{%- endif %}"
        'fan_only':
          value : 'Wind'
          connection: # Main command (sets the mode)
            params: { json: { "modes": ["Wind"] } }
            connection: # Nested command (ensures it is on)
              params: { json: { "Operation": { "power" : "On" } }, url: 'https://__CLIMATE_IP_HOST__:8888/devices/0' }
              condition_template: "{% if device_state.Operation.power == 'Off' -%}1{%- else -%}0{%- endif %}"
        'heat_cool':
          value : 'Auto'
          connection: # Main command (sets the mode)
            params: { json: { "modes": ["Auto"] } }
            connection: # Nested command (ensures it is on)
              params: { json: { "Operation": { "power" : "On" } }, url: 'https://__CLIMATE_IP_HOST__:8888/devices/0' }
              condition_template: "{% if device_state.Operation.power == 'Off' -%}1{%- else -%}0{%- endif %}"
        'off': # 'off' does not need a nested command
          value : 'Off'
          connection:
            params: { json: { "Operation": { "power" : "Off" } }, url: 'https://__CLIMATE_IP_HOST__:8888/devices/0' }
            condition_template: "{% if device_state.Operation.power == 'On' -%}1{%- else -%}0{%- endif %}"
      status_template: "{% if device_state.Operation.power == 'Off' -%}{{ device_state.Operation.power }}{%- else -%}{{ device_state.Mode.modes.0 }}{%- endif %}"
    preset: # preset_mode
      type: modes
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/0/mode' }
      values:
        'none': { value : 'Comode_Off', connection: { params: { json: { "options": ["Comode_Off"] } } } }
        'sleep': { value : 'Comode_Sleep', connection: { params: { json: { "options": ["Comode_Sleep"] } } } }
        'boost': { value : 'Comode_Speed', connection: { params: { json: { "options": ["Comode_Speed"] } } } }
        '2 step': { value : 'Comode_2Step', connection: { params: { json: { "options": ["Comode_2Step"] } } } }
        'comfort': { value : 'Comode_Comfort', connection: { params: { json: { "options": ["Comode_Comfort"] } } } }
        'quiet': { value : 'Comode_Quiet', connection: { params: { json: { "options": ["Comode_Quiet"] } } } }
        'single user': { value : 'Comode_Smart', connection: { params: { json: { "options": ["Comode_Smart"] } } } }
        'wind free': { value : 'Comode_Nano', connection: { params: { json: { "options": ["Comode_Nano"] } } } }
      status_template: '{{ device_state.Mode.options.0 }}'
    power:
      type: switch
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/0' }
      values:
        'off': { value: 'Off', connection: { params: { json: { "Operation": { "power" : "Off" } } } } }
        'on': { value: 'On', connection: { params: { json: { "Operation": { "power" : "On" } } } } }
      status_template: '{{ device_state.Operation.power }}'
    purify:
      type: switch
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/0/mode' }
      values:
        'off': { value: 'Spi_Off', connection: { params: { json: { "options": [ "Spi_Off"] } } } }
        'on': { value: 'Spi_On', connection: { params: { json: { "options": [ "Spi_On"] } } } }
      status_template: '{{ "on" if "Spi_On" in device_state.Mode.options else "off" }}'
    auto_clean:
      type: switch
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/0/mode' }
      values:
        'off': { value: 'Autoclean_Off', connection: { params: { json: { "options": [ "Autoclean_Off"] } } } }
        'on': { value: 'Autoclean_On', connection: { params: { json: { "options": [ "Autoclean_On"] } } } }
      status_template: '{{ "on" if "Autoclean_On" in device_state.Mode.options else "off" }}'
    beep:
      type: switch
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/0/mode' }
      values:
        'off': { value: 'Volume_Mute', connection: { params: { json: { "options": [ "Volume_Mute"] } } } }
        'on': { value: 'Volume_100', connection: { params: { json: { "options": [ "Volume_100"] } } } }
      status_template: '{{ "off" if "Volume_Mute" in device_state.Mode.options else "on" }}'
    fan: # fan_mode
      type: modes
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/0/wind' }
      values:
        'auto': { value : '0', connection: { params: { json: { "speedLevel": 0 } } } }
        'low': { value : '1', connection: { params: { json: { "speedLevel": 1 } } } }
        'medium': { value : '2', connection: { params: { json: { "speedLevel": 2 } } } }
        'high': { value : '3', connection: { params: { json: { "speedLevel": 3 } } } }
        'Turbo': { value : '4', connection: { params: { json: { "speedLevel": 4 } } } }
      status_template: '{{ device_state.Wind.speedLevel }}'
    fan_max: # fan_max_mode
      type: modes
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/0/wind' }
      values:
        'auto': { value : '0', connection: { params: { json: { "maxSpeedLevel": 0 } } } }
        'low': { value : '1', connection: { params: { json: { "maxSpeedLevel": 1 } } } }
        'medium': { value : '2', connection: { params: { json: { "maxSpeedLevel": 2 } } } }
        'high': { value : '3', connection: { params: { json: { "maxSpeedLevel": 3 } } } }
        'Turbo': { value : '4', connection: { params: { json: { "maxSpeedLevel": 4 } } } }
      status_template: '{{ device_state.Wind.maxSpeedLevel }}'
    swing: # swing_mode
      type: modes
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/0/wind' }
      values:
        'off': { value : "Fix", connection: { params: { json: { "direction": "Fix" } } } }
        'vertical': { value : "Up_And_Low", connection: { params: { json: { "direction": "Up_And_Low" } } } }
        'horizontal': { value : "Left_And_Right", connection: { params: { json: { "direction": "Left_And_Right" } } } }
        'both': { value : "All", connection: { params: { json: { "direction": "All" } } } }
      status_template: '{{ device_state.Wind.direction }}'
    good_sleep:
      type: number
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/0/mode'  }
      min: 0
      max: 24
      status_template: '{{ device_state.Mode.options.1[6::] }}'
      connection_template: '{ "json": { "options": ["Sleep_{{ value | int }}"] } }'
    temperature:
      type: number
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/0/temperatures/0' }
      min: 8
      max: 30
      status_template: '{{ device_state.Temperatures.0.desired | int }}'
      connection_template: '{ "json": { "desired": {{ value | int }} } }'
      unit_template: '{{ device_state.Temperatures.0.unit }}'
  attributes:
    current_temperature:
      type: number
      status_template: '{{ device_state.Temperatures.0.current }}'
      unit_template: 'Fahrenheit'
    min_temp:
      type: number
      status_template: '8'
      unit_template: '{{ device_state.Temperatures.0.unit }}'
    max_temp:
      type: number
      status_template: '30'
      unit_template: '{{ device_state.Temperatures.0.unit }}'
  sensors:
    outdoor_temperature:
      type: number
      name: "Outdoor Temperature"
      status_template: >-
        {% if 'Mode' in device_state and 'options' in device_state['Mode'] -%}
          {% for option in device_state['Mode']['options'] -%}
            {% if 'OutdoorTemp_' in option -%}
              {{ (option.split('_')[1] | int) - 55 }}
            {%- endif %}
          {%- endfor %}
        {%- endif %}
      device_class: "temperature"
      unit_of_measurement: "°C"
      validation_template: "{% if 'Mode' in device_state and 'options' in device_state['Mode'] %}valid{% endif %}"

    filter_clean_alarm:
      type: string
      name: "Filter Clean Alarm"
      status_template: >-
        {% for option in device_state.Mode.options -%}
          {% if 'FilterCleanAlarm_' in option -%}
            {% if option.split('_')[1] != '0' %}On{% else %}Off{% endif %}
          {%- endif %}
        {%- endfor %}
      device_class: "problem"
      validation_template: "{% if 'Mode' in device_state and 'options' in device_state['Mode'] %}valid{% endif %}"

    filter_time:
      type: number
      name: "Filter Time"
      status_template: >-
        {% for option in device_state.Mode.options -%}
          {% if 'FilterTime_' in option -%}
            {{ (option.split('_')[1] | int) / 10 }}
          {%- endif %}
        {%- endfor %}
      device_class: "duration"
      unit_of_measurement: "h"
      validation_template: "{% if 'Mode' in device_state and 'options' in device_state['Mode'] %}valid{% endif %}"

    filter_alarm_time:
      type: number
      name: "Filter Alarm Time"
      status_template: >-
        {% for option in device_state.Mode.options -%}
          {% if 'FilterAlarmTime_' in option -%}
            {{ option.split('_')[1] }}
          {%- endif %}
        {%- endfor %}
      device_class: "duration"
      unit_of_measurement: "h"
      validation_template: "{% if 'Mode' in device_state and 'options' in device_state['Mode'] %}valid{% endif %}"
