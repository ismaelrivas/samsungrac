rules:
  # ======================== BRONZE ========================
  action-setup: done
  appropriate-polling:
    status: done
    comment: >
      Polling interval defaults to 15 seconds with strict bounds [5s, 21600s].
      Hardware profiles and socket engines handle real-time push where supported.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # ======================== SILVER ========================
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: >
      Test suite covers over 95% of lines with 100% on config_flow.py and diagnostics.py.

  # ======================== GOLD ========================
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: >
      Samsung AC devices do not support mDNS/Zeroconf or DHCP discovery.
  discovery-update-info:
    status: exempt
    comment: Integration does not implement discovery flows.
  docs-data-update: todo
  docs-examples: done
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: done
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Multi-split AC indoor units are physically hardwired and static.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: done
  icon-translations: todo
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # ======================== PLATINUM ========================
  async-dependency:
    status: exempt
    comment: >
      Synchronous requests engine is retained strictly for backward compatibility
      with legacy Samsung AC hardware requiring custom TLS 1.0/1.1 ciphers.
  inject-websession: done
  strict-typing: todo
