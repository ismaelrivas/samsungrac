[mutmut]
paths_to_mutate=custom_components/climate_ip/climate.py
debug=false
max_stack_depth=100
tests_dir=custom_components/climate_ip/tests/

# Inject the HA custom component plugin so pytest-asyncio and async tests work.
# mutmut always uses its internal pytest.main() — it ignores pytest.ini when
# running from the mutants/ sandbox, so we must pass these options explicitly.
# --import-mode=importlib ensures pytest imports from mutants/ (trampoline copies)
# instead of the cached real path — this is critical for mutmut stats to work.
pytest_add_cli_args=
    -p 
    no:pytest_homeassistant_custom_component
    -o asyncio_mode=auto
    -o markers=skip_legacy
    --import-mode=importlib

also_copy=
    custom_components/climate_ip/
    conftest.py