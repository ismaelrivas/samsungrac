# Authentication flow specification for Samsung legacy AC units (Port 2878)
# Mode: stream (persistent duplex socket connection)

auth_flow:
  mode: "stream"
  buffer_size: 4096
  reconnect_delay: 1.5
  
  tls_config:
    default_cert: "ac14k_m.pem"
    ciphers:
      - "HIGH:!DH:!aNULL:@SECLEVEL=0"
      - "HIGH:!aNULL:!MD5:@SECLEVEL=0"
      - "ALL:@SECLEVEL=0"
    strategies:
      - { cert: "__user_cert__", verify_mode: "CERT_REQUIRED" }
      - { cert: "__user_cert__", verify_mode: "CERT_NONE" }
      - { cert: null, verify_mode: "CERT_NONE" }
      - { cert: "__default_cert__", verify_mode: "CERT_NONE" }

  request_pairing:
    method: "tcp"
    port: 2878
    payload: "<Request Type=\"GetToken\" />\r\n"
    success_template:
      match: 'Status="Ready"'
      fallback_match: 'InvalidateAccount'

  wait_token:
    timeout_seconds: 45
    
  extract_template:
    regex: 'Token="([a-fA-F0-9-]{36})"'
  error_template:
    match: 'Status="Fail"'
    extract_regex: 'ErrorCode="(\d+)"'