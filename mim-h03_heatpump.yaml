# Configuration for MIM-H03 controller attached to a Samsung Heat pump
# Please pay attention that the device ID is not the usual 0 but 032000000 in this particular case
# Use the following command to determine the appropriate device ID and adjust accordingly the params
#   curl -v -k -H "Content-Type: application/json" -H "Authorization: Bearer __CLIMATE_IP_TOKEN__" --cert ac14k_m.pem -X GET https://__CLIMATE_IP_HOST__:8888/devices/
device:
  auth_flow_file: 'auth_flows/samsungrac_auth.yaml'
  # --- DEVICE IDENTIFIERS ---
  # Map to extract unique identifiers from the initial device state.
  identifiers:
    # Path in the status JSON to find the list of devices.
    path_to_devices: ["Devices"]
    # Key for the device ID (used in command URLs).
    id: ["id"]
    # Key for the UUID (used as unique_id in Home Assistant).
    uuid: ["uuid"]

  # --- DEVICE CONFIGURATION ---
  poll: true
  name: 'mim-h03_heatpump'
  # The 'unique_id' block is omitted because it is now managed by the controller.
  connection:
    type: request
    params:
      verify: False
      headers: { "Authorization": "Bearer __CLIMATE_IP_TOKEN__", "Content-Type": "application/json" }
  status:
    type: 'json_status'
    connection:
      params: { method : 'GET', url: 'https://__CLIMATE_IP_HOST__:8888/devices' }
    # status_template is now handled internally by the controller,
    # which updates properties based on the selected device.
    # Kept for reference; the controller operates on the full payload.
    status_template: '{{ device_state }}'
  operations:
    hvac: # hvac_mode
      type: modes
      optimistic_cascades:
        - target_node: "Operation.power"
          value_map:
            off: "Off"
            default: "On"
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/mode' }
      values:
        cool: { value : 'Opmode_Cool', connection: { params: { json: { "Mode": { "modes": ["Opmode_Cool"] } } }, connection: { params: { json: { "Operation": { "power" : "On" } }, url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/operation' }, condition_template: "{% if device_state.Operation.power == 'Off' -%}1{%- else -%}0{%- endif %}", post_delay: 3 } } }
        heat: { value : 'Opmode_Heat', connection: { params: { json: { "Mode": { "modes": ["Opmode_Heat"] } } }, connection: { params: { json: { "Operation": { "power" : "On" } }, url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/operation' }, condition_template: "{% if device_state.Operation.power == 'Off' -%}1{%- else -%}0{%- endif %}", post_delay: 3 } } }
        'off': { value: 'Off', connection: { params: { json: { "Operation": { "power" : "Off" } }, url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/operation' } } }
        auto: { value : 'Opmode_Auto', connection: { params: { json: { "Mode": { "modes": ["Opmode_Auto"] } } }, connection: { params: { json: { "Operation": { "power" : "On" } }, url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/operation' }, condition_template: "{% if device_state.Operation.power == 'Off' -%}1{%- else -%}0{%- endif %}", post_delay: 3 } } }
        heat_cool: { value : 'Opmode_Auto', connection: { params: { json: { "Mode": { "modes": ["Opmode_Auto"] } } }, connection: { params: { json: { "Operation": { "power" : "On" } }, url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/operation' }, condition_template: "{% if device_state.Operation.power == 'Off' -%}1{%- else -%}0{%- endif %}", post_delay: 3 } } }
        fan_only: { value : 'Opmode_Fan', connection: { params: { json: { "Mode": { "modes": ["Opmode_Fan"] } } }, connection: { params: { json: { "Operation": { "power" : "On" } }, url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/operation' }, condition_template: "{% if device_state.Operation.power == 'Off' -%}1{%- else -%}0{%- endif %}", post_delay: 3 } } }
        dry: { value : 'Opmode_Dry', connection: { params: { json: { "Mode": { "modes": ["Opmode_Dry"] } } }, connection: { params: { json: { "Operation": { "power" : "On" } }, url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/operation' }, condition_template: "{% if device_state.Operation.power == 'Off' -%}1{%- else -%}0{%- endif %}", post_delay: 3 } } }
      # NOTE: status_template expressions must reference the root of the selected device object,
      # as the controller handles passing the matching sub-device object.
      # The original logic applies directly when the controller passes the device sub-object.
      state_node: 'Mode.modes.0'
      status_template: "{% if device_state.Operation.power == 'Off' -%}Off{%- elif device_state.Operation.power == 'On' -%}{{ device_state.Mode.modes.0 }}{%- endif %}"
    power:
      type: switch
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/operation' }
      values:
        'off': { value: 'Off', connection: { params: { json: { "Operation": { "power" : "Off" } } } } }
        'on': { value: 'On', connection: { params: { json: { "Operation": { "power" : "On" } } } } }
      state_node: 'Operation.power'
      status_template: '{{ device_state.Operation.power }}'
    beep:
      type: switch
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/mode' }
      values:
        'off': { value: 'Volume_Mute', connection: { params: { json: { "options": [ "Volume_Mute"] } } } }
        'on': { value: 'Volume_100', connection: { params: { json: { "options": [ "Volume_100"] } } } }
      state_node: 'Mode.options.0'
      status_template: '{{ device_state.Mode.options.0 }}'
    fan: # fan_mode
      type: modes
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/wind' }
      values:
        # For some reason, the values a bit opposite
        'Auto': { value : '0', connection: { params: { json: { "Wind": { "speedLevel": 0 } } } } }
        'Low': { value : '4', connection: { params: { json: { "Wind": { "speedLevel": 4 } } } } }
        'Medium': { value : '3', connection: { params: { json: { "Wind": { "speedLevel": 3 } } } } }
        'High': { value : '2', connection: { params: { json: { "Wind": { "speedLevel": 2 } } } } }
      state_node: 'Wind.speedLevel'
      status_template: '{{ device_state.Wind.speedLevel }}'
    swing: # swing_mode (indoor units report supportedWindModes "Up_And_Low" and "Fix")
      type: modes
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/wind' }
      values:
        'off': { value : 'Fix', connection: { params: { json: { "Wind": { "direction": "Fix" } } } } }
        'vertical': { value : 'Up_And_Low', connection: { params: { json: { "Wind": { "direction": "Up_And_Low" } } } } }
      state_node: 'Wind.direction'
      status_template: '{{ device_state.Wind.direction }}'
    temperature:
      type: number
      connection:
        params: { method: 'PUT', url: 'https://__CLIMATE_IP_HOST__:8888/devices/__DEVICE_ID__/temperatures/0' }
      min: 16
      max: 55
      state_node: 'Temperatures.0.desired'
      status_template: '{{ device_state.Temperatures.0.desired | int }}'
      connection_template: '{ "json": { "Temperature": { "desired": {{ value | int }} } } }'
  attributes:
    current_temperature:
      type: number
      status_template: '{{ device_state.Temperatures.0.current }}'
    target_temperature:
      type: number
      status_template: '{{ device_state.Temperatures.0.desired }}'
    min_temp:
      type: number
      status_template: '{{ device_state.Temperatures.0.minimum }}'
    max_temp:
      type: number
      status_template: '{{ device_state.Temperatures.0.maximum }}'
